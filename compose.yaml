services:
  app:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "5174:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    stdin_open: true
    tty: true

  shadcn-example:
    image: node:22-alpine
    working_dir: /app/examples/shadcn-vue
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "5175:5173"
    # The root is an npm workspace ("workspaces": ["examples/*"]) specifically so vue/zod/
    # @vueuse/core/@standard-schema/spec hoist to one shared copy in /app/node_modules —
    # this example imports EzForm's own src directly (no published package yet), and a
    # second physical `vue` install breaks both type-checking and the Vue runtime itself.
    # `npm install` must run from /app (the workspace root), not this subfolder.
    command: sh -c "cd /app && npm install && cd examples/shadcn-vue && npm run dev"
    stdin_open: true
    tty: true

  install-test:
    image: node:22-alpine
    working_dir: /app/install-test
    volumes:
      - .:/app
    ports:
      - "5176:5176"
    # Deliberately NOT a workspace member (not under examples/, not listed in the root
    # package.json's "workspaces") and has its own node_modules, so `npm install` here
    # really installs ezform from the packed tarball like a real consumer would, instead
    # of npm silently symlinking it to this repo's own local source.
    command: sh -c "npm install && npx vite --host 0.0.0.0 --port 5176"
    stdin_open: true
    tty: true

  docs:
    image: node:22-alpine
    working_dir: /app
    # CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID for `npm run docs:deploy` (see .env.example).
    env_file:
      - path: .env
        required: false
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "8080:8080"
    command: sh -c "npm install && npm run docs:dev"
    stdin_open: true
    tty: true

volumes:
  node_modules:
